<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Сердце из признаний</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Noto+Sans+Devanagari:wght@700&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+Thai:wght@700&display=swap">
<style>
/* Layout: одна сцена на весь экран. Слова на разных языках по одному появляются внутри
   сердца, без наложений, как в Python-версии на видео. Красный неон на чёрном. */
:root {
  --bg: #000000;
  --neon: #ff0033;
  --neon-glow: rgba(255, 0, 51, 0.8);
  --hint: rgba(255, 0, 51, 0.62);
  --font-body: "Noto Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
  background: var(--bg);
}
html { box-sizing: border-box; height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  height: 100%;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--neon);
  font-family: var(--font-body);
  overflow: hidden;
}
.stage { position: relative; width: 100%; height: 100%; min-width: 0; }
#heart {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 5px var(--neon-glow));
  touch-action: manipulation;
}
.hint {
  position: absolute;
  left: 0;
  bottom: 14px;
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--hint);
  opacity: 0;
  transition: opacity 0.8s ease;
  pointer-events: none;
}
.hint.on { opacity: 1; }
</style>

<div class="stage" id="stage">
  <canvas id="heart" role="img" aria-label="Сердце, составленное из слов «я тебя люблю» на разных языках"></canvas>
  <p class="hint" id="hint">Коснись — слова соберутся заново</p>
</div>

<script>
(function () {
  "use strict";

  var PHRASES = [
    "Люблю тебя", "I love you", "Seni sevaman", "Seni seviyorum", "Te amo",
    "Je t'aime", "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ",
    "Ik hou van jou", "Jag älskar dig", "Kocham cię", "ฉันรักเธอ", "Anh yêu em",
    "Aku cinta kamu", "Я тебе кохаю"
  ];
  var FAM = '"Noto Sans","Noto Sans Thai","Noto Sans Devanagari","Noto Sans JP","Noto Sans KR","Noto Sans SC",system-ui,"Segoe UI",Roboto,sans-serif';
  var TAU = Math.PI * 2;

  /* LAYOUT-START
     Раскладка живёт в виртуальной сетке 1000 x VH и не зависит от размера экрана. */
  var VW = 1000, UNIT = VW / 32, VH = UNIT * 29, MW = 500, MH = Math.ceil(VH / 2);
  var mask = null;

  function heartV(t) {
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [VW / 2 + UNIT * x, VH / 2 - UNIT * (y + 2.5)];
  }

  // Маска сердца в половинном разрешении, заливка построчно по пересечениям.
  function buildMask() {
    var n = 720, xs = new Float64Array(n), ys = new Float64Array(n), i;
    for (i = 0; i < n; i++) {
      var p = heartV(i / n * TAU);
      xs[i] = p[0] / 2;
      ys[i] = p[1] / 2;
    }
    var m = new Uint8Array(MW * MH);
    for (var row = 0; row < MH; row++) {
      var yc = row + 0.5, cr = [];
      for (i = 0; i < n; i++) {
        var j = (i + 1) % n, y0 = ys[i], y1 = ys[j];
        if ((y0 <= yc && y1 > yc) || (y1 <= yc && y0 > yc)) {
          cr.push(xs[i] + (yc - y0) / (y1 - y0) * (xs[j] - xs[i]));
        }
      }
      cr.sort(function (a, b) { return a - b; });
      for (var c = 0; c + 1 < cr.length; c += 2) {
        var a = Math.max(0, Math.ceil(cr[c] - 0.5));
        var b = Math.min(MW - 1, Math.floor(cr[c + 1] - 0.5));
        for (var x = a; x <= b; x++) m[row * MW + x] = 1;
      }
    }
    return m;
  }

  function inm(x, y) {
    var ix = (x / 2) | 0, iy = (y / 2) | 0;
    if (x < 0 || y < 0 || ix >= MW || iy >= MH) return false;
    return mask[iy * MW + ix] === 1;
  }

  // Прямоугольник слова целиком внутри сердца (с небольшим отступом от края).
  function fitsHeart(x, y, w, h) {
    var m = 4, x0 = x - w / 2 - m, x1 = x + w / 2 + m, y0 = y - h / 2 - m, y1 = y + h / 2 + m, v;
    for (v = x0; v <= x1; v += 10) { if (!inm(v, y0) || !inm(v, y1)) return false; }
    for (v = y0; v <= y1; v += 10) { if (!inm(x0, v) || !inm(x1, v)) return false; }
    return inm(x1, y0) && inm(x1, y1) && inm(x0, y1);
  }

  function overlaps(list, x, y, w, h, padX, padY) {
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (Math.abs(x - r.x) * 2 < w + r.w + padX * 2 && Math.abs(y - r.y) * 2 < h + r.h + padY * 2) return true;
    }
    return false;
  }

  // Сначала крупные слова, потом всё мельче: пустоты добиваются мелкими.
  function pack(compact, ratio) {
    if (!mask) mask = buildMask();
    var sMax = compact ? 54 : 36, sMin = compact ? 26 : 15;
    var padX = sMin * 0.6, padY = sMin * 0.2;
    var out = [], size = sMax, miss = 0, last = -1, idx, tr, ok, s, w, h, x, y;

    function attempt(sz) {
      do { idx = (Math.random() * PHRASES.length) | 0; } while (idx === last);
      s = sz * (0.9 + 0.2 * Math.random());
      w = ratio[idx] * s;
      h = s * 1.22;
      x = w / 2 + Math.random() * (VW - w);
      y = h / 2 + Math.random() * (VH - h);
      if (!fitsHeart(x, y, w, h)) return false;
      if (overlaps(out, x, y, w, h, padX, padY)) return false;
      out.push({ p: PHRASES[idx], x: x, y: y, w: w, h: h, s: s });
      last = idx;
      return true;
    }

    while (size >= sMin) {
      ok = false;
      for (tr = 0; tr < 40 && !ok; tr++) ok = attempt(size);
      if (ok) miss = 0;
      else if (++miss >= 10) { size *= 0.94; miss = 0; }
    }
    for (tr = 0; tr < 8000; tr++) attempt(sMin * 0.85);
    return out;
  }
  /* LAYOUT-END */

  var stage = document.getElementById("stage");
  var cv = document.getElementById("heart");
  var hint = document.getElementById("hint");
  var ctx = cv.getContext("2d");
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  var W = 0, H = 0, dpr = 1, k = 1, ox = 0, oy = 0;
  var ratio = [], words = [], compactMode = null, started = false;
  var doneT = 0, nextTw = 0, hintShown = false, hintTimer = 0;
  var NEON = "#ff0033", FILL_SECONDS = 9;

  function now() { return performance.now() / 1000; }

  function measure() {
    ctx.font = "700 100px " + FAM;
    ratio = PHRASES.map(function (p) { return ctx.measureText(p).width / 100; });
  }

  function makeWords(compact) {
    compactMode = compact;
    words = pack(compact, ratio);
    for (var i = 0; i < words.length; i++) {
      words[i].font = "700 " + words[i].s.toFixed(1) + "px " + FAM;
      words[i].born = -10;
      words[i].flash = -10;
    }
  }

  // Порядок появления случайный, слова выходят примерно равными порциями.
  function schedule(t0) {
    var n = words.length, order = [], i, j, tmp;
    for (i = 0; i < n; i++) order.push(i);
    for (i = n - 1; i > 0; i--) {
      j = (Math.random() * (i + 1)) | 0;
      tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var dt = FILL_SECONDS / Math.max(1, n);
    for (i = 0; i < n; i++) {
      var born = t0 + i * dt + (Math.random() - 0.5) * dt * 0.6;
      words[order[i]].born = Math.max(t0, born);
      words[order[i]].flash = words[order[i]].born;
    }
    doneT = t0 + FILL_SECONDS + 0.9;
    nextTw = doneT + 0.5;
    hintShown = false;
    clearTimeout(hintTimer);
    hint.classList.remove("on");
  }

  function layoutCanvas() {
    var r = stage.getBoundingClientRect();
    W = Math.max(200, r.width);
    H = Math.max(200, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    k = Math.min(W / VW, H / VH) * 0.97;
    ox = (W - VW * k) / 2;
    oy = (H - VH * k) / 2;
  }

  function bump(x, m, w) { var d = (x - m) / w; return Math.exp(-d * d); }
  function beat(x) { return 0.6 * bump(x, 0.1, 0.06) + 0.4 * bump(x, 0.34, 0.08); }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    var b = 1;
    if (!reduce && t > doneT) b += 0.012 * beat((t - doneT) % 2.4);
    var cxs = W / 2, cys = H / 2;

    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (t < w.born) continue;
      var age = t - w.flash;
      var q = age >= 0.9 ? 1 : Math.max(0, age) / 0.9;
      var inv = 1 - q;
      var s = k * b * (1 + 0.3 * inv * inv);
      var X = ox + k * w.x, Y = oy + k * w.y;
      ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (cxs + b * (X - cxs)), dpr * (cys + b * (Y - cys)));
      ctx.globalAlpha = Math.min(1, (t - w.born) / 0.15);
      ctx.fillStyle = q < 1
        ? "rgb(255," + Math.round(236 * inv) + "," + Math.round(51 + 189 * inv) + ")"
        : NEON;
      ctx.font = w.font;
      ctx.fillText(w.p, 0, 0);
    }
    ctx.globalAlpha = 1;
  }

  var raf = 0;
  function frame() {
    var t = now();
    if (t > doneT) {
      if (!hintShown) {
        hintShown = true;
        hint.classList.add("on");
        hintTimer = setTimeout(function () { hint.classList.remove("on"); }, 9000);
      }
      if (t > nextTw && words.length) {
        words[(Math.random() * words.length) | 0].flash = t;
        nextTw = t + 0.12 + Math.random() * 0.2;
      }
    }
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  function restart() {
    if (reduce || !started) return;
    if (now() < doneT) return;
    schedule(now() + 0.2);
  }

  function rebuild() {
    layoutCanvas();
    var compact = W < 520;
    if (started && compact !== compactMode) {
      makeWords(compact);
      if (reduce) staticShow(); else schedule(now() + 0.2);
    }
    if (started && reduce) draw(0);
  }

  function staticShow() {
    for (var i = 0; i < words.length; i++) { words[i].born = -10; words[i].flash = -10; }
    doneT = -10;
  }

  function start() {
    if (started) return;
    layoutCanvas();
    measure();
    makeWords(W < 520);
    started = true;
    if (reduce) {
      staticShow();
      draw(0);
    } else {
      schedule(now() + 0.3);
      raf = requestAnimationFrame(frame);
    }
  }

  stage.addEventListener("pointerdown", restart);

  if (window.ResizeObserver) {
    new ResizeObserver(rebuild).observe(stage);
  } else {
    window.addEventListener("resize", rebuild);
  }

  // Ждём шрифты, чтобы ширины слов были точными; через 3.5 с стартуем в любом случае.
  var SAMPLES = [
    ["Noto Sans", PHRASES.join("")],
    ["Noto Sans Thai", "ฉันรักเธอ"],
    ["Noto Sans Devanagari", "मैं तुमसे प्यार करता हूँ"],
    ["Noto Sans JP", "愛してる"],
    ["Noto Sans KR", "사랑해"],
    ["Noto Sans SC", "我爱你"]
  ];
  var loads = (document.fonts && document.fonts.load)
    ? Promise.all(SAMPLES.map(function (s) {
        return document.fonts.load('700 40px "' + s[0] + '"', s[1]).catch(function () {});
      }))
    : Promise.resolve();
  var wait = new Promise(function (resolve) { setTimeout(resolve, 3500); });
  Promise.race([loads, wait]).then(start);

  // Шрифт дозагрузился после старта: пересчитываем ширины и собираем заново.
  if (document.fonts && document.fonts.addEventListener) {
    var lateLoads = 0;
    document.fonts.addEventListener("loadingdone", function () {
      if (!started || lateLoads++ > 1) return;
      measure();
      makeWords(compactMode);
      if (reduce) { staticShow(); draw(0); } else { schedule(now() + 0.2); }
    });
  }
})();
</script>

</body></html>
